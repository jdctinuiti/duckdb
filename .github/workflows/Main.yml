name: Windows 32-bit unmodified baseline
on:
  push:
    branches: [ci/read-ahead-windows32-baseline]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-2022
    env:
      GEN: ninja
      CC: clang-cl
      CXX: clang-cl
      DUCKDB_VERSION: v2.0.0
      DUCKDB_COMMIT: 943b7af1def8b92fc3bf282e75240839f3a1c2c5
      EXTRA_CMAKE_VARIABLES: -DCMAKE_C_COMPILER_TARGET=i686-pc-windows-msvc -DCMAKE_CXX_COMPILER_TARGET=i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 943b7af1def8b92fc3bf282e75240839f3a1c2c5
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/ccache-action
      - uses: ./.github/actions/setup-msvc-env
        with:
          arch: x86
          host_arch: x64
      - name: Build unchanged upstream source
        shell: bash
        run: |
          clang-cl --version
          python scripts/ci/retry.py -- make windows_release_32
      - name: Reproduce the failing test
        shell: bash
        run: python test/run.py test/sql/aggregate/group/perfect_hash_corrupt_stats_wrapped_id.test
